  .card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 20px 60px rgba(80, 30, 100, 0.25), 0 4px 12px rgba(0,0,0,0.08);
    border: 1px solid rgba(255,255,255,0.6);
  }
  h1 {
    font-size: 28px;
    text-align: center;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4ade80);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: #7a6b86; font-size: 14px; margin-bottom: 20px; }

  .counter {
    background: rgba(124, 92, 200, 0.08);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 18px;
    font-size: 13px;
    color: #5a4768;
  }
  .counter strong { color: #d6336c; font-size: 16px; }
  .progress {
    height: 8px;
    background: rgba(0,0,0,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #84fab0, #8fd3f4, #ff6ec4);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  textarea {
    width: 100%;
    min-height: 100px;
    padding: 14px;
    border: 2px solid #e8d9f0;
    border-radius: 14px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
    background: #fffdfa;
  }
  textarea:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,0.18); }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin: 14px 0;
  }
  button {
    padding: 12px 8px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    font-family: inherit;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.05); }
  button:active { transform: translateY(0); }
  .btn-enc { background: linear-gradient(135deg, #ff6ec4, #7873f5); box-shadow: 0 6px 16px rgba(120,115,245,0.35); }
  .btn-dec { background: linear-gradient(135deg, #4ade80, #06b6d4); box-shadow: 0 6px 16px rgba(6,182,212,0.35); }
  .btn-clr { background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 6px 16px rgba(239,68,68,0.3); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .output-area {
    margin-top: 6px;
  }
  .output-area label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #5a4768;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .copy-btn {
    background: #a78bfa;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 8px;
    box-shadow: none;
  }
  .output {
    min-height: 100px;
    padding: 14px;
    background: #1f1b2e;
    color: #e8d9f0;
    border-radius: 14px;
    font-size: 16px;
    word-break: break-all;
    line-height: 1.6;
    white-space: pre-wrap;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }
  .output:empty::before {
    content: "结果会出现在这里 ✨";
    color: #6b5d7a;
    font-style: italic;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: #9b8aa8;
    margin-top: 16px;
  }
  .footer a { color: #7c5cb8; cursor: pointer; text-decoration: underline; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(20, 10, 30, 0.65);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal.hidden { display: none; }
  .modal-card {
    background: #fff;
    border-radius: 20px;
    padding: 28px;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: pop 0.3s ease;
  }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-card h2 { font-size: 20px; margin-bottom: 10px; color: #d6336c; }
  .modal-card p { color: #5a4768; font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
  .qr-placeholder {
    width: 180px;
    height: 180px;
    margin: 0 auto 18px;
    background: repeating-linear-gradient(45deg, #f3e8ff 0 10px, #e9d5ff 10px 20px);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7c3aed;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    padding: 10px;
    border: 2px dashed #a78bfa;
  }
  .modal-card button {
    background: linear-gradient(135deg, #ff6ec4, #7873f5);
    width: 100%;
    padding: 12px;
    box-shadow: 0 6px 16px rgba(120,115,245,0.35);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 趣味字符加密器</h1>
    <p class="subtitle">把文字变成日语 + 意大利语 + 甲骨文的混合密文，还能还原 ✨</p>

    <div class="counter">
      <span>免费使用：<strong id="used">0</strong> / 520 次</span>
      <div class="progress"><div id="bar"></div></div>
    </div>

    <textarea id="input" placeholder="在这里输入文字... 例如：你好世界 Hello 123"></textarea>

    <div class="buttons">
      <button class="btn-enc" id="btnEnc">🔒 加密</button>
      <button class="btn-dec" id="btnDec">🔓 解密</button>
      <button class="btn-clr" id="btnClr">🗑 清空</button>
    </div>

    <div class="output-area">
      <label>
        <span>结果</span>
        <button class="copy-btn" id="btnCopy">📋 复制</button>
      </label>
      <div class="output" id="output"></div>
    </div>

    <div class="footer">
      <span>本地加密 · 无需联网 · 💛</span>
      <br>
      <a id="resetLink" title="仅供开发者演示">杜嘉芯可重置次数</a>
    </div>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <h2>🎉 已达 520 次免费额度</h2>
      <p>感谢使用！继续畅玩请扫码付费解锁，永久不限次 ✨</p>
      <div class="qr-placeholder">请在此处替换为<br>您的收款二维码</div>
      <button id="btnClose">我知道了</button>
    </div>
  </div>

<script>
  // ============ 字符池：日语(平假名+片假名) + 意大利语(拉丁字母及重音) + 甲骨文风古汉字 ============
  const POOL = Array.from(
    "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン" +
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÂÃÄÇÈÉÊËÌÍÎÏÑàáâãäçèéêëìíîïñ" +
    "人天夫夨夭央女母好姐妹妻妾子孙孝孚宀宅宇守安宋宏宗官宙定宛宜宝实宠审宪宫宰害宴宵家宸容宽寮宁寨寻专射将尔尹尺尼尾居屋屈展屠履山岔岛岳岸岩峰峻岭峪峡峨峭崎崖崛嵘嵯巅巛"
  );
  const INDEX = new Map(POOL.map((c, i) => [c, i]));
  const KEY = 0x5A; // XOR key — 让"加密"更名副其实

  function encrypt(text) {
    const bytes = new TextEncoder().encode(text);
    return Array.from(bytes).map(b => POOL[b ^ KEY]).join('');
  }

  function decrypt(text) {
    const chars = Array.from(text).filter(c => /\S/.test(c));
    if (chars.length === 0) throw new Error('空文本');
    const bytes = [];
    for (const c of chars) {
      if (!INDEX.has(c)) throw new Error('文本包含非加密字符："' + c + '"');
      bytes.push(INDEX.get(c) ^ KEY);
    }
    return new TextDecoder().decode(new Uint8Array(bytes));
  }

  // ============ 使用次数管理（localStorage 软限制） ============
  const LIMIT = 520;
  const KEY_USE = 'funCipher.uses';
  const KEY_PAID = 'funCipher.paid';

  function getUses() { return parseInt(localStorage.getItem(KEY_USE) || '0', 10); }
  function setUses(n) { localStorage.setItem(KEY_USE, String(n)); }
  function isPaid() { return localStorage.getItem(KEY_PAID) === '1'; }
  function bumpUse() { const n = getUses() + 1; setUses(n); return n; }

  function refreshCounter() {
    const used = getUses();
    document.getElementById('used').textContent = used;
    const pct = Math.min(100, (used / LIMIT) * 100);
    document.getElementById('bar').style.width = pct + '%';
  }

  function canUse() { return isPaid() || getUses() < LIMIT; }

  function showPaywall() {
    document.getElementById('modal').classList.remove('hidden');
  }
  function hidePaywall() {
    document.getElementById('modal').classList.add('hidden');
  }

  // ============ UI 交互 ============
  const $input = document.getElementById('input');
  const $output = document.getElementById('output');

  function flash(msg, isError = false) {
    $output.textContent = msg;
    $output.style.color = isError ? '#ff6b6b' : '#e8d9f0';
  }

  function doEncrypt() {
    if (!canUse()) { showPaywall(); return; }
    const text = $input.value;
    if (!text) { flash('⚠️ 请先输入要加密的文字', true); return; }
    try {
      const result = encrypt(text);
      $output.textContent = result;
      $output.style.color = '#e8d9f0';
      bumpUse();
      refreshCounter();
      if (!canUse()) setTimeout(showPaywall, 300);
    } catch (e) {
      flash('❌ 加密失败：' + e.message, true);
    }
  }

  function doDecrypt() {
    if (!canUse()) { showPaywall(); return; }
    const text = $input.value;
    if (!text) { flash('⚠️ 请先输入要解密的字符', true); return; }
    try {
      const result = decrypt(text);
      $output.textContent = result;
      $output.style.color = '#e8d9f0';
      bumpUse();
      refreshCounter();
      if (!canUse()) setTimeout(showPaywall, 300);
    } catch (e) {
      flash('❌ 解密失败：' + e.message, true);
    }
  }

  function doClear() {
    $input.value = '';
    $output.textContent = '';
    $output.style.color = '#e8d9f0';
  }

  function doCopy() {
    const text = $output.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('btnCopy');
      const old = btn.textContent;
      btn.textContent = '✅ 已复制';
      setTimeout(() => btn.textContent = old, 1500);
    }).catch(() => flash('❌ 复制失败，请手动选择', true));
  }

  document.getElementById('btnEnc').addEventListener('click', doEncrypt);
  document.getElementById('btnDec').addEventListener('click', doDecrypt);
  document.getElementById('btnClr').addEventListener('click', doClear);
  document.getElementById('btnCopy').addEventListener('click', doCopy);
  document.getElementById('btnClose').addEventListener('click', hidePaywall);

  document.getElementById('resetLink').addEventListener('click', () => {
    if (confirm('【开发者演示】确认重置使用次数为 0？')) {
      setUses(0);
      localStorage.removeItem(KEY_PAID);
      refreshCounter();
      alert('已重置');
    }
  });

  refreshCounter();
</script>
</body>
</html>
